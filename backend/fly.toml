# fly.toml app configuration file generated for my-muscle-app on 2026-06-12T22:26:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'my-muscle-app'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
